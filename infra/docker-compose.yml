services:
  postgres:
    image: postgres:16-alpine
    container_name: legalmene-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: legalmene
      POSTGRES_PASSWORD: legalmene
      POSTGRES_DB: legalmene
      TZ: America/Santiago
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalmene -d legalmene"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:5
    container_name: legalmene-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
