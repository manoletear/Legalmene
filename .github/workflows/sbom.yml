name: SBOM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # Lunes 04:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  sbom:
    name: CycloneDX SBOM + npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "9.15.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Generate SBOM (CycloneDX)
        run: |
          npx -y @cyclonedx/cdxgen \
            --output sbom.json \
            --type js \
            --recurse \
            .

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.json
          retention-days: 90

      - name: npm audit (high severity)
        run: pnpm audit --audit-level=high --prod || true

      - name: Summary
        run: |
          echo "## SBOM" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Componentes: $(jq '.components | length' sbom.json)" >> $GITHUB_STEP_SUMMARY
          echo "Spec: $(jq -r .specVersion sbom.json)" >> $GITHUB_STEP_SUMMARY
